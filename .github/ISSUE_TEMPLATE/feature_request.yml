name: Feature request
description: Suggest a feature or improvement
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to improve?
      description: Describe the current experience and the change you want.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: How would it help?
      description: Explain when you would use it. Sketches or examples are welcome.
